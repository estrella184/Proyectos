<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ordenar tres números</title>
</head>
<body>

<script>
    function ordenarNumeros(a,b,c) {
        let numeros = [a,b,c];

        numeros.sort(function(x,y) {
            return x-y;
        });

        document.write("Números ordenados de menor a mayor:<br>");
        document.write(numeros[0] + " -> " + numeros[1] + " -> " + numeros[2]);
    }

    let n1=parseInt(prompt("Ingrese el primer número:"));
    let n2=parseInt(prompt("Ingrese el segundo número:"));
    let n3=parseInt(prompt("Ingrese el tercer número:"));
    ordenarNumeros(n1, n2, n3);
</script>

</body>
</html>
