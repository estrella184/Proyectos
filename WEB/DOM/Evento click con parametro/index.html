<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DOM dinámico - Crear elementos</title>
</head>
<body>

    <h1>Ejemplo: Creación dinámica de elementos</h1>

    <!-- Botón que dispara la creación -->
    <button id="btnCrear">Crear elemento</button>

    <!-- Contenedor donde se insertará el nuevo elemento -->
    <div id="contenedor"></div>

    <!-- JavaScript -->
    <script>
        // 1. Acceso a los elementos existentes del DOM
        let boton = document.getElementById("btnCrear");
        let contenedor = document.getElementById("contenedor");

        // 2. Registro del evento click
        boton.addEventListener("click", crearElemento);

        // 3. Función que crea un elemento dinámicamente
        function crearElemento() {

            // Crear un nuevo elemento <p>
            let nuevoParrafo = document.createElement("p");

            // Asignar contenido al elemento creado
            nuevoParrafo.textContent = "Este elemento fue creado dinámicamente con JavaScript";

            // Insertar el elemento en el DOM
           // contenedor.appendChild(nuevoParrafo);
        }
    </script>

</body>
</html>
