<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejmeplo basico de evento click</title>
    </head>
    <body>
        <h1>Evento click en JavaScript</h1>
        <!-- Botón con evento click directo-->
         <button onclick="mostrarMensaje()">Haz Click</button>
         <!-- Código JavaScript -->
          <script>
            function mostrarMensaje(){
                alert("Hiciste click en el botón. ")
            }
            </script>
    </body>
</html>
